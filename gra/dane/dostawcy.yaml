# Dostawcy
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'Dostawcy jedzenia: rodzaj, dni dostaw (0 = poniedziałek), koszt dostawy (darmowa od progu zamówienia), minimalne zamówienie,
  odbiór osobisty w dyskoncie (czas właściciela, limit opakowań na składnik na dzień), gazetki (co tydzień kilka składników
  taniej). Ceny: miesiąc → dostawca → składnik → jakość → cena za opakowanie; w miesiącach bez danych cena waha się losowo
  wokół tej bazy.'
zrodlo: notatka „Elementy mapy” (dyskonty, hurtownie, producent mięsa, piekarnia – marki z notatki); ceny, dni dostaw, progi
  i limity – założenie F3a.6 (ceny względem dawnej hurtowni z F2.6), do kalibracji w kroku 5
pierwsi:
- Piekarnia Koziołek
- Biedronka
- Lidl
- Stokrotka
- Makro
- Selgros
- Eurocash
- Zakłady Mięsne „Rożen” z Łęcznej
wszyscy_od_miesiaca: styczen
dostawcy:
  Piekarnia Koziołek:
    rodzaj: piekarnia
    opis: Świeże bułki, pita i tortille – dowóz codziennie rano, osobna ilość na każdy dzień.
    dni_dostaw:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    koszt_dostawy: 15
    darmowa_od: 150
  Biedronka:
    rodzaj: dyskont
    opis: Dobre ceny przy małych ilościach, gazetka z promocjami. Towar przywozisz sam.
    dni_dostaw:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    odbior_osobisty: true
    godziny_odbioru: 1.5
    limit_opakowan: 4
    gazetka:
      pozycji: 3
      rabat_min: 0.15
      rabat_max: 0.35
  Lidl:
    rodzaj: dyskont
    opis: Tydzień kuchni śródziemnomorskiej co tydzień – falafel i pita w gazetce bywają tanie.
    dni_dostaw:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    odbior_osobisty: true
    godziny_odbioru: 1.5
    limit_opakowan: 4
    gazetka:
      pozycji: 3
      rabat_min: 0.15
      rabat_max: 0.35
  Stokrotka:
    rodzaj: dyskont
    opis: Lubelski dyskont przy osiedlu – blisko, ale trochę drożej. Ma surówki.
    dni_dostaw:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    odbior_osobisty: true
    godziny_odbioru: 1.0
    limit_opakowan: 4
    gazetka:
      pozycji: 2
      rabat_min: 0.1
      rabat_max: 0.25
  Makro:
    rodzaj: hurtownia
    opis: Ceny hurtowe i pełny asortyment. Dowóz w poniedziałki i czwartki.
    dni_dostaw:
    - 0
    - 3
    koszt_dostawy: 79
    darmowa_od: 1000
  Selgros:
    rodzaj: hurtownia
    opis: Hurtownia z dobrym mięsem i napojami. Dowóz we wtorki i piątki.
    dni_dostaw:
    - 1
    - 4
    koszt_dostawy: 69
    darmowa_od: 900
  Eurocash:
    rodzaj: hurtownia
    opis: Najtańsze warzywa i sosy, bez dań wege. Dowóz w poniedziałki, środy i piątki.
    dni_dostaw:
    - 0
    - 2
    - 4
    koszt_dostawy: 89
    darmowa_od: 1200
  Zakłady Mięsne „Rożen” z Łęcznej:
    rodzaj: producent
    opis: 'Producent stożków kebab: najlepsza cena i jakość mięsa, ale tylko większe zamówienia. Dowóz we wtorki i piątki.'
    dni_dostaw:
    - 1
    - 4
    minimalne_zamowienie: 800
    od_rundy: 3
