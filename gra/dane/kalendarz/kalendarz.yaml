  od: '03-21'
  do: '03-21'
  strefy:
    zemborzyce: 1.5
    stare_miasto: 1.2
    akademickie: 1.15
- nazwa: Przerwa wielkanocna na uczelniach
  rodzaj: uczelnie
  opis: >-
    Studenci wracają do domów na święconkę i mazurka. W akademiku zostają pisanki z zeszłego roku i jeden student,
    który twierdzi, że „pisze magisterkę”.
  wzgledem: wielkanoc
  od: -3
  do: 2
  strefy:
    akademickie: 0.5
    politechnika: 0.5
- nazwa: Wielkanoc
  rodzaj: swieto
  opis: >-
    W sobotę koszyczki ze święconką, w niedzielę śniadanie do obiadu, w poniedziałek – śmigus-dyngus. Kto wyjdzie
    z domu, wraca mokry. Kebab na wynos jest w tym tygodniu bardziej na wynos niż zwykle.
  wzgledem: wielkanoc
  od: -1
  do: 1
  strefy:
    wszystkie: 0.45
