opis: >-
  Kalendarz miejski Lublina (gra z lokalami, silnik/kalendarz.py): święta, rok akademicki (sesja, przerwy), szkoły
  (ferie), okazje handlowe i wydarzenia w mieście. Każde wydarzenie mnoży dzienną pulę klientów w strefach
  (klucz `wszystkie` – każda strefa bez własnego mnożnika). Daty stałe jako 'MM-DD' (zakres może przechodzić przez
  Nowy Rok); daty ruchome – `wzgledem` (klucz z `ruchome`) i przesunięcie w dniach `od`/`do`.
zrodlo: >-
  Notatki „Prawidła świata” (kalendarz miejski: święta, sesja i wakacje studentów, wydarzenia w mieście – zmieniają
  popyt w strefach) i „Menu i składniki” (popyt zależny od kalendarza miejskiego). Mnożniki, daty ferii i wydarzeń
  miejskich – założenia gry (do potwierdzenia); wcześniej kalendarz był w mapa/popyt.yaml (F3a.4).
rodzaje:
  swieto: Święto
  uczelnie: Uczelnie
  szkoly: Szkoły
  handel: Okazja handlowa
  miasto: Wydarzenie w mieście
ruchome:
  wielkanoc:
    2025: '04-20'
    2026: '04-05'
    2027: '03-28'
    2028: '04-16'
  black_friday:            # piątek po czwartym czwartku listopada
    2025: '11-28'
    2026: '11-27'
    2027: '11-26'
    2028: '11-24'
  ferie_zimowe:            # poniedziałek pierwszego tygodnia ferii w województwie lubelskim (założenie)
    2025: '01-27'
    2026: '02-02'
    2027: '01-18'
    2028: '02-14'
wydarzenia:
- nazwa: Wakacje studenckie
  rodzaj: uczelnie
  opis: >-
    Wrzesień: studenci jeszcze odsypiają lato u rodziców, a Miasteczko Akademickie należy do gołębi i ekip
    remontowych malujących akademiki na ten sam beżowy kolor co rok temu. Dobry czas, żeby spokojnie przygotować
    lokal, zanim w październiku wróci głodna fala.
  od: '09-01'
  do: '09-30'
  strefy:
    akademickie: 0.35
    politechnika: 0.4
    centrum: 0.9
- nazwa: Początek roku szkolnego
  rodzaj: szkoly
  opis: >-
    Uczniowie wracają do szkół, rodzice odprowadzają pierwszaków i szukają czegoś, co da się zjeść jedną ręką,
    drugą trzymając tornister w kształcie dinozaura.
  od: '09-01'
  do: '09-01'
  strefy:
    wszystkie: 1.05
- nazwa: Powrót studentów
  rodzaj: uczelnie
  opis: >-
    Ostatni weekend września: pociągi z Rzeszowa, Zamościa i Białej Podlaskiej przywożą studentów ze słoikami od
    mamy. Słoiki starczają do wtorku – od środy zaczyna się sezon na kebab.
  od: '09-26'
  do: '09-30'
  strefy:
    akademickie: 1.6
    politechnika: 1.5
    dworzec: 1.3
- nazwa: Inauguracja roku akademickiego
  rodzaj: uczelnie
  opis: >-
    Rektorzy w togach, gaudeamus i przemówienia o „nowym rozdziale”. Po uroczystości cały rozdział – w liczbie
    kilku tysięcy osób – szuka obiadu w promieniu pięciuset metrów od auli.
  od: '10-01'
  do: '10-03'
  strefy:
    akademickie: 1.35
    politechnika: 1.3
    centrum: 1.1
- nazwa: Konfrontacje Teatralne
  rodzaj: miasto
  opis: >-
    Na Starym Mieście aktorzy w białych maskach chodzą na szczudłach i udają drzewa. Widzowie po trzech godzinach
    spektaklu bez słów wychodzą z jednym pragnieniem – coś zjeść i wreszcie z kimś porozmawiać.
  od: '10-08'
  do: '10-17'
  strefy:
    stare_miasto: 1.15
- nazwa: Otrzęsiny pierwszego roku
  rodzaj: uczelnie
  opis: >-
    Pierwszoroczniacy przechodzą „chrzest” w fontannie na Placu Litewskim, a potem – mokrzy, dumni i głodni – szukają
    czegoś ciepłego. Starsze roczniki twierdzą, że w ich czasach fontanna była zimniejsza.
  od: '10-15'
  do: '10-17'
  strefy:
    akademickie: 1.4
    politechnika: 1.25
    centrum: 1.1
- nazwa: Halloween
  rodzaj: miasto
  opis: >-
    Pół Miasteczka Akademickiego przebiera się za zombie, druga połowa za studentów po sesji – trudno ich odróżnić.
    Wampiry zamawiają kebab „bez czosnku”, a kucharze nie wiedzą, czy to żart.
  od: '10-31'
  do: '10-31'
  strefy:
    akademickie: 1.3
    stare_miasto: 1.25
- nazwa: Wszystkich Świętych
  rodzaj: swieto
  opis: >-
    Pół miasta jedzie na cmentarz przy Lipowej, druga połowa stoi w korku do cmentarza przy Lipowej. Głodni są
    wszyscy, ale nikt nie ma jak dojechać do kebaba.
  od: '11-01'
  do: '11-01'
  strefy:
    wszystkie: 0.6
- nazwa: Święto Niepodległości
  rodzaj: swieto
  opis: >-
    Parada w Centrum, flagi na balkonach i kolejka po kebaba dłuższa niż kolejka po lody w lipcu. Pan z orkiestry
    dętej zamawia z tubą pod pachą – tuba dostaje osobne frytki.
  od: '11-11'
  do: '11-11'
  strefy:
    wszystkie: 0.8
    centrum: 1.5
    stare_miasto: 1.3
- nazwa: Black Friday
  rodzaj: handel
  opis: >-
    Galerie handlowe otwierają się o szóstej rano, a o szóstej pięć ktoś już niesie trzy telewizory i jeden toster.
    Po ośmiu godzinach polowania na promocje klienci jedzą wszystko, co nie jest przecenione o 70%.
  wzgledem: black_friday
  od: 0
  do: 0
  strefy:
    centrum: 1.35
    zygmuntowskie: 1.2
    lsm_czuby: 1.15
- nazwa: Andrzejki
  rodzaj: uczelnie
  opis: >-
    W akademikach leje się wosk przez klucz, a z kształtów wychodzą wyłącznie kebaby. Wróżka z trzeciego piętra
    przepowiada wszystkim „wielką miłość do sosu czosnkowego” – jak dotąd ma 100% trafności.
  od: '11-29'
  do: '11-30'
  strefy:
    akademickie: 1.3
    stare_miasto: 1.2
- nazwa: Jarmark bożonarodzeniowy
  rodzaj: miasto
  opis: >-
    Na Placu po Farze stoją drewniane budki z grzańcem, piernikami i pluszowymi koziołkami w czapkach Mikołaja.
    Grzaniec rozgrzewa, pierniki zaklejają zęby, a kebab okazuje się jedynym obiadem w promieniu kilometra.
  od: '12-05'
  do: '12-23'
  strefy:
    stare_miasto: 1.25
    centrum: 1.1
- nazwa: Mikołajki
  rodzaj: miasto
  opis: >-
    Biegacze w strojach Mikołaja okrążają Zamek, a po biegu tłum czerwonych czapek szturmuje bary. Kasjer pyta
    „na miejscu czy na wynos?”, a słyszy w odpowiedzi „ho, ho, ho”.
  od: '12-06'
  do: '12-06'
  strefy:
    stare_miasto: 1.3
    centrum: 1.15
- nazwa: Przerwa świąteczna na uczelniach
  rodzaj: uczelnie
  opis: >-
    Studenci wyjeżdżają do domów, gdzie babcia gotuje lepiej niż Ty i nie liczy za dokładkę. Miasteczko
    akademickie pustoszeje, a w akademiku zostaje tylko kot portiera i doktorant z grantem.
  od: '12-21'
  do: '01-06'
  strefy:
    akademickie: 0.35
    politechnika: 0.35
- nazwa: Wigilia i Boże Narodzenie
  rodzaj: swieto
  opis: >-
    Dwanaście potraw w każdym domu – kebab nie jest jedną z nich (jeszcze). Twoi kucharze i tak przychodzą do pracy
    po karpia, który miał być w wannie, ale uciekł.
  od: '12-24'
  do: '12-26'
  strefy:
    wszystkie: 0.35
- nazwa: Sylwester
  rodzaj: miasto
  opis: >-
    Koncert na Placu Zamkowym. O północy fajerwerki, o pierwszej – kolejka po kebaba aż do Bramy Krakowskiej. Ktoś
    składa życzenia noworoczne rożnowi.
  od: '12-31'
  do: '12-31'
  strefy:
    stare_miasto: 2.0
    centrum: 1.4
- nazwa: Nowy Rok
  rodzaj: swieto
  opis: >-
    Miasto śpi do południa, a potem szuka czegoś tłustego na ratunek. Postanowienie „od jutra dieta” trzyma się
    średnio do 13:20.
  od: '01-01'
  do: '01-01'
  strefy:
    wszystkie: 0.6
- nazwa: Trzech Króli
  rodzaj: swieto
  opis: >-
    Orszak przechodzi przez Stare Miasto z wielbłądem, który – według organizatorów – jest „prawie prawdziwy”. Sklepy
    zamknięte, więc kto nie poszedł za orszakiem, idzie za zapachem rożna.
  od: '01-06'
  do: '01-06'
  strefy:
    wszystkie: 0.7
    stare_miasto: 1.3
- nazwa: Ferie zimowe
  rodzaj: szkoly
  opis: >-
    Uczniowie mają dwa tygodnie wolnego. Połowa rodzin wyjeżdża w góry stać w kolejce do wyciągu, druga połowa
    zostaje i spędza ferie w galerii handlowej – dzieci przy automatach, rodzice przy ladzie z jedzeniem.
  wzgledem: ferie_zimowe
  od: 0
  do: 13
  strefy:
    centrum: 1.1
    lsm_czuby: 0.9
    czechow: 0.9
- nazwa: Sesja zimowa
  rodzaj: uczelnie
  opis: >-
    Studenci nie mają czasu gotować, bo uczą się do egzaminów (a przynajmniej tak mówią rodzicom). Notatki kserowane
