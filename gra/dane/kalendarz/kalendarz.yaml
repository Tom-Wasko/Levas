  od: '02-14'
  do: '02-14'
  strefy:
    stare_miasto: 1.4
- nazwa: Dzień Kobiet
  rodzaj: handel
  opis: >-
    Kwiaciarnie przy Krakowskim Przedmieściu wyprzedają tulipany do jedenastej. Panowie, którzy nie zdążyli, ratują
    sytuację zaproszeniem „na coś dobrego” – czyli do Ciebie.
  od: '03-08'
  do: '03-08'
  strefy:
    stare_miasto: 1.15
    centrum: 1.1
- nazwa: Pierwszy dzień wiosny
  rodzaj: miasto
  opis: >-
    Uczniowie topią Marzannę w Bystrzycy, studenci „wagarują w celach naukowych” nad Zalewem Zemborzyckim. Marzanna
