  od: '01-26'
  do: '02-08'
  strefy:
    akademickie: 1.2
    politechnika: 1.2
- nazwa: Tłusty czwartek
  rodzaj: swieto
  opis: >-
    Cały Lublin stoi w kolejkach do cukierni, a ludzie liczą pączki, nie kalorie. Do kebaba przychodzą tylko ci,
    którzy zjedli już osiem i potrzebują „czegoś słonego na przełamanie”.
  wzgledem: wielkanoc
  od: -52
  do: -52
  strefy:
    wszystkie: 0.85
- nazwa: Przerwa międzysemestralna
  rodzaj: uczelnie
  opis: >-
    Po sesji studenci uciekają w góry albo do rodziców. Zostają tylko ci z poprawką – zamawiają „to co zwykle” i
    patrzą w okno z miną filozofa.
  od: '02-09'
  do: '02-22'
  strefy:
    akademickie: 0.5
    politechnika: 0.5
- nazwa: Walentynki
  rodzaj: handel
  opis: >-
    Kolacja przy świecach na Starym Mieście. Część par kończy wieczór przy kebabie – i to są te szczęśliwe. Jedna
