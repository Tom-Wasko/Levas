# Boty
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'Strategie botów: cena w ułamku ceny preferowanej (null = średnia rynku), jakość, docelowa liczba dań, pokrycie popytu,
  wyposażenie i udogodnienia (sztuki), reklama (medium → emisje), internet, szkolenia; gra z lokalami: kampanie
  (agencja/kanał z mapa/reklama.yaml) zamiast reklamy i internetu, bufor_kampanii – gotówka po kampaniach,
  min_sila_kampanii – słabszej kampanii (po powtórkach) bot nie zamawia; promocje (typ z mapa/promocje.yaml
  i ozdobna nazwa) – na najdroższe danie w sprzedaży, nowe tylko z buforem gotówki, wszystkie wyłączone, gdy bot
  obsłużył mniej niż min_obsluga_promocji popytu poprzedniej rundy.'
zrodlo: założenie (strategie typowych drużyn z gier ATH i A/B/C), liczba dań dopasowana do menu kebaba
ustawienia:
  bufor_gotowki: 30000
  bufor_kampanii: 12000
  min_sila_kampanii: 0.5
  min_obsluga_promocji: 0.9
  cena_nasladowcy_bez_danych: 0.95
  krok_ceny: 0.5
  losuj_z_najlepszych_kandydatow: 3
  zapas_zasobow: 1.05
# Poziomy trudności: mistrz gry wybiera je dla każdego bota (konfiguracja gry: firmy[].poziom). Zachowanie botów
