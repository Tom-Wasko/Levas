# Katalog ofert stałych
# Sprawdzenie: python -m silnik.dane sprawdz
opis: Stałe oferty gry (ceny, koszty utrzymania, zasięgi). Liczby z gier REVAS (dane_revas/katalog.yaml), nazwy przerobione
  na kebab (F2.6).
rundy:
  zrodlo: instrukcja gry REVAS (zakładki odblokowywane w kolejnych rundach) i ustalenia z użytkownikiem
  kalendarz:
    okres: tydzien
    rund_w_roku: 52
    start: 2025-09-01
    zrodlo: 'notatka „Ustalenia gry”: runda = 1 tydzień; start – użytkownik 27.10 (PRACA_NOCNA pyt. 2): pierwszy
      tydzień września (poniedziałek 1.09.2025), wrzesień to wprowadzenie, zabawa zaczyna się, gdy wracają studenci'
  domyslna_liczba: 18   # 18 pełnych tygodni: 1.09.2025 – 4.01.2026 (użytkownik 27.10)
  odblokowanie:
    '1':
    - nazwa_firmy
    - misja
    - oferta
    - inwestycje_stanowiska
    - finanse_bank
    - finanse_biuro
    '2':
    - inwestycje_sprzet
    - hr_zatrudnienie
    - dostawcy
    - sprzedaz
    '3':
    - karta_wynikow
    - hr_udogodnienia
    '4':
    - inwestycje_wyposazenie
    - karta_skumulowana
    '5':
    - marketing_tradycyjny
    '6':
    - marketing_internetowy
    '7':
    - hr_szkolenia
  harmonogram_lokali:
    zrodlo: 'gra z lokalami (F4.3): tydzień, od którego działa zakładka – mistrz gry może go zmienić dla gry; terminy
      elementów mapy (kanały rekrutacji, agencje, promocje, parki, handel…) są w ich danych. Domyślnie jak w REVAS:
      tydzień 1 to przygotowanie lokalu (bez ofert dostawców i sprzedaży), notatka „Ustalenia gry” – karta skumulowana
      od 4 (dostawcy i pracuj.pl od 1 – PRACA_NOCNA pyt. 24)'
    zakladki:
      nazwa_firmy: {nazwa: Nazwa firmy, tydzien: 1}
      misja: {nazwa: Misja, tydzien: 1}
      oferta: {nazwa: Menu, tydzien: 1}
      inwestycje_stanowiska: {nazwa: Stanowiska, tydzien: 1}
      inwestycje_sprzet: {nazwa: Sprzęt i leasing, tydzien: 2}
      sprzedaz: {nazwa: Ceny dań, tydzien: 2}
      dostawcy: {nazwa: Dostawcy, tydzien: 2}
      hr_zatrudnienie: {nazwa: Zatrudnienie, tydzien: 2}
      finanse_bank: {nazwa: Bank, tydzien: 1}
      finanse_biuro: {nazwa: Biuro rachunkowe, tydzien: 1}
      karta_wynikow: {nazwa: Karta wyników, tydzien: 3}
      hr_udogodnienia: {nazwa: Udogodnienia, tydzien: 3}
      inwestycje_wyposazenie: {nazwa: Wyposażenie, tydzien: 4}
      karta_skumulowana: {nazwa: Karta skumulowana, tydzien: 4}
      hr_szkolenia: {nazwa: Szkolenia, tydzien: 7}
  uslugi_w_rundzie_1: 3
  uslugi_startowe:
  - kebab_w_bulce
  - frytki
  - napoj
  uslugi_startowe_zrodlo: 'założenie F2.6: na start podstawowe menu – kebab w bułce, frytki, napój'
  nowe_uslugi_na_runde: 3
  nowe_uslugi_od_rundy: 3
stanowiska:
  zrodlo: 'stanowiska r9 + KPiR styczeń–czerwiec (gra ATH); działają w rundzie zakupu. startowe – plan F2.7: jeden
    gotowy lokal na start (kuchnia z rożnem, frytownicą i lodówką, kasa), jakość podstawowa'
  startowe:
  - typ: kuchnia
    sprzet:
      Rożen: 1
      Frytownica: 1
      Lodówka na napoje: 1
  - typ: kasa
    sprzet:
      Kasa fiskalna: 1
      Lada z witryną: 1
      Tablica menu: 1
  pakiety:
    '1': 1000
    '2': 1800
    '3': 2200
    '4': 3000
    '5': 4000
  typy:
    kuchnia:
      nazwa: Stanowiska kuchenne
      kto: Kuchnia
      zawody:
      - Kucharz
    kasa:
      nazwa: Stanowiska kasowe
      kto: Kasa
      zawody:
      - Kasjer
