# Lokale i działki – globalna pula (lokal zajęty przez drużynę znika z oferty innych)
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'Lokale do najmu lub kupna. Kwoty w złotych, czynsz i utrzymanie (media) miesięczne – silnik przelicza je
  na rundę. gotowy: działa od razu, sprzęt wynajmującego (przy najmie nie można go sprzedać); niewyposazony: 1 runda
  urządzania, jednorazowa adaptacja, cały sprzęt trzeba kupić; dzialka: tylko kupno, budowa budowa_rund rund, koszt_budowy
  płatny w równych ratach co rundę budowy. miejsca: ile stanowisk każdego typu zmieści lokal. Kaucja przy najmie:
  kaucja_miesiecy × czynsz (zwrotna przy wyprowadzce – później).'
zrodlo: 'założenie F3a.3: czynsz = metraż × stawka strefy (strefy.yaml: czynsz_m2; gotowy +25%), cena kupna ≈ 40
  miesięcznych czynszów (gotowy +10%; ceny rynkowe przeskalowane do kapitału gry), działka = m² gruntu × 3 × czynsz_m2,
  budowa 900 zł/m², adaptacja 250 zł/m², media 300 zł + 25 zł/m²; rząd wielkości (oferty najmu w Lublinie 2025:
  40–130 zł/m²), do kalibracji w kroku 5'
zasady:
  nowy_lokal_co_rund: 3
  kaucja_miesiecy: 2
  urzadzanie_rund: 1
zestawy:
  podstawowy:
    nazwa: Zestaw podstawowy (★)
    opis: 'Używany sprzęt po poprzednim najemcy: działa, choć rożen skrzypi przy każdym obrocie.'
    stanowiska:
    - typ: kuchnia
      sprzet:
        Rożen: 1
        Frytownica: 1
        Lodówka na napoje: 1
    - typ: kasa
      sprzet:
        Kasa fiskalna: 1
        Lada z witryną: 1
        Tablica menu: 1
  solidny:
    nazwa: Zestaw solidny (★★)
    opis: Zadbany sprzęt średniej klasy z kompletną kasą.
    stanowiska:
    - typ: kuchnia
      sprzet:
        Rożen: 2
        Frytownica: 2
        Lodówka na napoje: 2
    - typ: kasa
      sprzet:
        Kasa fiskalna: 2
        Lada z witryną: 2
        Tablica menu: 2
  podwojny:
    nazwa: Zestaw podwójny (★★)
    opis: Dwie linie kuchenne i kasa – lokal po dużej sieci, która „zmieniła strategię”.
    stanowiska:
    - typ: kuchnia
      sprzet:
        Rożen: 2
        Frytownica: 2
        Lodówka na napoje: 2
    - typ: kuchnia
      sprzet:
        Rożen: 2
        Frytownica: 2
    - typ: kasa
      sprzet:
        Kasa fiskalna: 2
        Lada z witryną: 2
        Tablica menu: 2
