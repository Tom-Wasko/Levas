opinie:
  start: 3.6             # ocena tygodnia przed przeżyciami klientów (gwiazdki 1–5)
  jakosc: 0.3            # za każdą gwiazdkę jakości dania ponad 2 (średnia ważona składników, kucharzy, sprzętu)
  cena: 2.0              # za każde +100% ceny ponad cenę preferowaną strefy (taniej – plus)
  cena_limit: 0.6        # największy wpływ ceny w jedną stronę (gwiazdki)
  kolejka: 4.0           # × udział klientów, którzy odeszli z kolejki (pracownicy, sprzęt, kasa) × czekanie grup
  brak: 3.0              # × udział klientów odesłanych z braku dania (składniki, stanowisko)
  reklamacje: 10.0       # × udział reklamacji w sprzedaży
  wyposazenie: 2.0       # × (mnożnik wyposażenia − 1)
  udzial_opinii: 0.02    # ułamek obsłużonych klientów, którzy wystawiają opinię
  rozrzut: 0.8           # rozrzut pojedynczej opinii (gwiazdki); średnia tygodnia – rozrzut / √liczby
  zanik: 0.6             # waga opinii z poprzednich tygodni (× co tydzień)
  n0: 10                 # zaufanie do oceny: W / (W + n0)
  odniesienie: 3.3       # ocena, przy której mnożnik popytu = 1
  wykladnik: 0.4         # kalibracja 4.11: przy 1 ocena 4★ dawała +22% popytu – za mocno obok jakości w atrakcyjności
  komentarze: 3          # ile komentarzy pokazać przy lokalu
  prog_komentarza: 0.1   # powód oceny (gwiazdki) od którego klienci o nim piszą
  ocena_dobra: 3.8       # od tej oceny komentarz ogólny jest pochwałą, poniżej – „średnio”
  skala: 5               # najwyższa ocena (gwiazdki 1–skala)
komentarze:
  jakosc_plus:
    - Mięso jak u babci, gdyby babcia była Turczynką. Pięć gwiazdek.
    - Sos tak dobry, że wylizałem papierek. Nie oceniajcie mnie.
    - Wróciłam po dokładkę, a potem jeszcze raz, „po przepis”.
  jakosc_minus:
    - Mięso miało fakturę podeszwy. Smak też.
    - Bułka przeżyła więcej niż ja przez cały semestr.
    - Sos czosnkowy bez czosnku. Nawet wampir by się nie przestraszył.
  cena_minus:
    - Smaczne, ale za tę cenę spodziewałem się kebaba ze złotą folią.
    - Zapłaciłam jak za obiad w Paryżu, a jestem na Lubelszczyźnie.
    - Portfel płakał głośniej niż ja przy cebuli.
  cena_plus:
    - Za te pieniądze to praktycznie dobroczynność. Dziękuję!
    - Najtańszy obiad od czasu stołówki w podstawówce.
    - Najadłem się za drobne z kieszeni kurtki.
  kolejka:
    - Stałem w kolejce tak długo, że dostałem pocztą wezwanie na wybory.
    - Kolejka sięgała do sąsiedniej strefy. Odpuściłam.
    - Przyszedłem głodny, wyszedłem głodny, ale za to starszy.
  brak:
    - Chciałam falafel, a usłyszałam „dziś nie ma”. Wczoraj też nie było.
    - Połowa menu wykreślona markerem. Fajne bazgroły.
    - Zamówiłem danie z menu i okazało się, że to była tylko propozycja.
  reklamacje:
    - Oddałem jedzenie do reklamacji. Kucharz wyglądał, jakby to była rutyna.
    - Zamiast frytek dostałam rozczarowanie w papierowej torbie.
    - Było zimne. Gorąca była tylko moja reklamacja.
  wyposazenie:
    - Klimatyzacja, wygodne krzesła – prawie zostałem tu zamieszkać.
    - Ładnie tu, nawet kwiatek w doniczce na serio żyje.
  ogolnie_plus:
    - Szybko, smacznie, uprzejmie. Czego chcieć więcej? Może drugiego kebaba.
    - Moje ulubione miejsce. Nie mówcie nikomu, bo będą kolejki.
    - Obsługa uśmiechnięta, jedzenie ciepłe, życie piękne.
  ogolnie_srednio:
    - Kebab jak kebab. Zjadłem, przeżyłem, polecam umiarkowanie.
    - Ani źle, ani dobrze – idealnie przeciętnie.
    - Nie zachwyca, nie rozczarowuje. Trzy gwiazdki z rozpędu.
