# Klienci miasta (U24): grupy klientów z koszykiem i opinie o lokalach
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'U24 (decyzja autora 4.11.2026). Grupy klientów (silnik/rynek/klienci.py): klienci strefy to mieszanka grup
  (strefy – udziały, suma 1); goście wydarzeń to nadwyżka klientów z kalendarza miejskiego. Grupa ma wrażliwość
  na cenę (cena: mnożnik wrażliwości strefy, w strefie uśredniony do 1), wrażliwość na czekanie i wagę jakości
  (w ocenie lokalu), udział wegetarian i koszyk (ile chętniej niż przeciętnie bierze danie). Wegetarianie grupy
  nie biorą dań z listy mieso – ich część przechodzi na dania z listy wege. Koszyk zmienia, które dania są popularne
  w strefie; popyt całego miasta na danie zostaje jak w uslugi.yaml (normalizacja). zastepstwo: część klientów
  dania, którego lokal nie ma, bierze u niego inne danie z tej samej grupy dań (atrakcyjność × udzial).
  Opinie (silnik/rynek/opinie.py): ocena tygodnia lokalu z przeżyć klientów (jakość, cena wobec strefy, kolejka,
  brak dań, reklamacje, wyposażenie), opinie – ułamek klientów; ocena lokalu = średnia krocząca (zanik wagi
  starych opinii); mnożnik popytu = 1 + zaufanie × ((ocena / odniesienie)^wykladnik − 1), zaufanie = W / (W + n0).
  Komentarze – szablony do powodów (losowane strumieniem „opinie”).'
zrodlo: 'założenia U24 (pewność: założenie, do kalibracji): grupy i udziały – wg opisów klientów stref (strefy.yaml)
  i starego Levasa (koszyk, wegetarianie); odniesienie oceny dobrane tak, żeby mnożnik typowego lokalu botów był
  zbliżony do dawnego mnożnika z karty zadowolenia (mediana 0,91–0,98 dla poziomów łatwy…trudny, pomiar 4.11.2026 –
  dziennik kalibracji U24)'
