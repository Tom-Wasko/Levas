  stare_miasto: {turysci: 0.35, imprezowicze: 0.25, studenci: 0.1, biurowi: 0.1, rodziny: 0.1, uczniowie: 0.05, podrozni: 0.05}
  centrum: {biurowi: 0.4, studenci: 0.15, uczniowie: 0.1, turysci: 0.1, imprezowicze: 0.1, rodziny: 0.1, podrozni: 0.05}
