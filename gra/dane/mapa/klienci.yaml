    koszyk: {kebab_w_bulce: 1.3, kebab_w_tortilli: 1.1, kebab_box: 1.2, talerz_kebab: 0.5, falafel: 1.3, frytki: 1.2, napoj: 1.0, dodatek: 1.1}
  uczniowie:
    nazwa: Uczniowie
    opis: Przychodzą stadem po lekcjach. Frytki i napój to dla nich pełny obiad.
    podpisy: [uczeń 2b, licealistka, ktoś na wagarach, przewodniczący klasy]
    cena: 1.6
