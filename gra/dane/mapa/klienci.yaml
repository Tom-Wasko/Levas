    koszyk: {kebab_w_bulce: 1.3, kebab_w_tortilli: 1.0, kebab_box: 1.0, talerz_kebab: 0.3, falafel: 0.6, frytki: 1.6, napoj: 1.4, dodatek: 1.2}
  biurowi:
    nazwa: Pracownicy biur
    opis: Lunch w 30 minut, w tym 10 na kolejkę – więcej nie ma. Cena mniej ważna, byle szybko i porządnie.
    podpisy: [specjalista ds. Excela, pani z księgowości, kierownik projektu, ktoś z open space’u]
    cena: 0.8
