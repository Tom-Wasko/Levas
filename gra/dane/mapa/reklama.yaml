# Agencje reklamowe na mapie miasta (F3b.2) – kampanie z listy: agencja × kanał × strefa
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'Agencje reklamowe gry z lokalami (silnik/rynek/reklama.py). Kampania to agencja × kanał × strefa z liczbą
  emisji w tej rundzie (emisja – jednostka kanału: paczka ulotek, post, spot w radiu…). Cena emisji netto (VAT 23%)
  płatna z góry: przy zasięgu „strefa” cena_emisji × pula strefy z mapa/popyt.yaml (więcej ludzi – drożej, zaokrąglona
  do złotówki), przy zasięgu „miasto” – bez mnożnika, efekt w każdej strefie. znizki – progi rabatu kanału [od ilu
  emisji, rabat] na wszystkie emisje zamówienia; maks_emisji – najwięcej w jednej rundzie. Efekt w rundzie emisji:
  pula i przyciaganie (ułamki przy pełnym nasyceniu) × (1 − e^(−tempo_emisji × emisje)) – ok. 10 emisji to ponad
  90% efektu; pula poszerza pulę klientów strefy (korzystają wszystkie lokale, najwięcej reklamujący się),
  przyciaganie podnosi atrakcyjność firmy u mieszkańców strefy (odbiera klientów konkurencji). Agencja należy do
  rodzaju kanału: kilka drużyn w tym samym rodzaju i strefie w tej samej rundzie się zagłusza. model: zagluszanie –
  efekt × 1 / (1 + zagluszanie × (n − 1)), n – liczba firm z kampanią tego rodzaju w strefie w tej rundzie;
  wygasanie – po rundzie emisji efekt spada co rundę × wygasanie, aż będzie mniejszy niż prog_wygasania.
  teksty – komiczne raporty agencji po rundzie ({strefa} – nazwa strefy). internet (UF19) – marketing
  internetowy (zakładka Marketing → Internet, od rundy 7): te same pola kanałów, ale efekt kampanii nie kończy się
  na rundzie emisji – w rundzie emisji i kolejnych działa część efektu z listy narastanie (posty się udostępnia,
  opinie przybywają), potem co rundę × trwalosc (wolniej niż reklama tradycyjna), aż spadnie poniżej
  prog_wygasania. Zagłuszanie, nasycenie emisjami i sufit – jak w reklamie tradycyjnej (model wyżej).'
zrodlo: 'notatka „Elementy mapy” (kilka agencji, każda z własnymi kanałami: ulotki i plakaty, internet i social media,
  radio i billboardy, lokalne wydarzenia; kampanie z listy; reklama poszerza pulę i odbiera klientów konkurencji; ten
  sam kanał w tej samej strefie osłabia kampanie) i „Ustalenia gry” (runda 3 – część kanałów, runda 5 – wszystkie);
  liczby – założenie F3b.2 (kampania ok. 2–15% tygodniowego utargu lokalu); P10 (odpowiedź 14): jedna
  kampania ok. +4–10% popytu lokalu, kilka razem ok. +10–30% – sufit maks_przyciagania i maks_puli; Z5 (przebudowa
  2.11.2026): emisje, progi rabatów i nasycenie 1 − e^(−0,265 · emisje) – mechanizm reklamy tradycyjnej z gry ATH
  (dokumentacja/WIEDZA_O_GRZE.md §10, za zgodą autora), ceny emisji tak, by ok. 8 emisji kosztowało tyle co dawna
  kampania na rundę'
model:
  zagluszanie: 0.5
  tempo_emisji: 0.265      # nasycenie kampanii: efekt × (1 − e^(−tempo × emisje))
  wygasanie: 0.5
  prog_wygasania: 0.1
  maks_przyciagania: 0.7   # P10: suma kampanii firmy w strefie nasyca się do +70% atrakcyjności (≈ +30% popytu)
  maks_puli: 0.15          # poszerzenie puli strefy przez wszystkie kampanie – najwyżej +15%
agencje:
  papier_przyjmie:
    nazwa: Drukarnia „Papier Przyjmie”
    budynek: drukarnia
    rodzaj: druk
    opis: Pan Zdzisław drukuje wszystko, co się da złożyć na pół. Toner kupuje hurtowo, przecinki – detalicznie.
    kanaly:
      ulotki:
        nazwa: Ulotki za wycieraczki
        od_rundy: 5
        zasieg: strefa
        emisja: paczka 250 ulotek
        cena_emisji: 45
        znizki: [[4, 0.15], [11, 0.3]]
        maks_emisji: 20
        pula: 0.04
        przyciaganie: 0.12
        teksty:
        - 'Roznosiciel Kacper rozdał w strefie {strefa} 2 000 ulotek, w tym 400 jednemu panu, który „zbiera na rozpałkę”.
          Reszta trafiła za wycieraczki, do skrzynek i – według świadków – do paszczy psa sąsiada. Pies od tamtej pory
          zatrzymuje się przed Twoim lokalem.'
        - 'Ulotki w strefie {strefa} wydrukowano z literówką „Kebap z podwójnym mięsem i podwójnym sosem i podwójną
          literówką”. Paradoksalnie ludzie robili zdjęcia i wysyłali znajomym. Pan Zdzisław twierdzi, że to celowe.'
      plakaty:
        nazwa: Plakaty na słupach ogłoszeniowych
        od_rundy: 5
        zasieg: strefa
        emisja: 10 plakatów na słupach
        cena_emisji: 55
        znizki: [[5, 0.2], [11, 0.3]]
        maks_emisji: 20
        pula: 0.04
        przyciaganie: 0.16
        teksty:
        - 'Plakaty w strefie {strefa} wiszą na każdym słupie między ogłoszeniem „Zaginął kot Mruczek” a „Znaleziono kota,
          chyba Mruczek”. Twój kebab wygląda na nich apetyczniej niż oba koty razem.'
        - 'Klej do plakatów okazał się tak mocny, że służby miejskie w strefie {strefa} poddały się po trzech próbach.
          Plakat zostanie tam prawdopodobnie do 2031 roku. Agencja nie dolicza za to ani grosza.'
  fala_koziolka:
    nazwa: Radio i billboardy „Fala Koziołka”
    budynek: fala_koziolka
    rodzaj: radio_billboard
    opis: 'Rozgłośnia, która gra wyłącznie disco polo i prognozę pogody, plus trzy billboardy przy rondach. Jingiel
      nagrywa właściciel, a chórki – jego teściowa.'
    kanaly:
      billboard:
        nazwa: Billboard przy rondzie
        od_rundy: 8
        zasieg: strefa
        emisja: dzień na billboardzie
        cena_emisji: 70
        znizki: [[4, 0.15], [7, 0.3]]
        maks_emisji: 7
        pula: 0.06
        przyciaganie: 0.2
        teksty:
        - 'Billboard przy rondzie w strefie {strefa} jest tak duży, że kierowcy robią dodatkowe kółko, żeby doczytać
          menu. Korki wzrosły o 4%, sprzedaż – też. Drogowcy pytają, czy możesz zmniejszyć czcionkę.'
        - 'Na billboardzie w strefie {strefa} ktoś domalował kebabowi wąsy. Agencja uważa, że „dodało to charakteru”,
          i wysłała Ci fakturę za „pakiet street-art”. Fakturę grzecznie odrzuciłeś.'
      radio:
        nazwa: Spot w radiu „Fala Koziołka”
        od_rundy: 8
        zasieg: miasto
        emisja: spot w radiu
        cena_emisji: 70   # B10: przy 180 zł radio przegrywało z każdym kanałem (−0,04 karty, b10_kanaly); przy 70 zł ≈ inne kanały
        znizki: [[10, 0.2], [21, 0.3]]
        maks_emisji: 30
        pula: 0.03
        przyciaganie: 0.1
        teksty:
        - 'Spot leciał między „Majteczkami w kropeczki” a prognozą pogody. Lektor tak przejął się rolą, że wymienił
          wszystkie sosy z nazwy, a potem jeszcze raz, bo „słuchacze mogli nie dosłyszeć”. Cały Lublin nuci jingiel.'
        - 'W radiowym konkursie „Zgadnij, co jest w sosie czosnkowym” nikt nie zgadł (czosnek). Nagroda – kebab
          w Twoim lokalu – i tak zrobiła Ci reklamę w całym mieście.'
  kozi_grod:
    nazwa: Agencja eventowa „Kozi Gród Events”
    budynek: kozi_grod_events
    rodzaj: wydarzenia
    opis: Organizują festyny, otrzęsiny i jedną imprezę, o której nikt nie chce mówić. Mają własnego Koziołka
      w przebraniu (rozmiar XXL).
    kanaly:
      degustacja:
        nazwa: Degustacja na festynie osiedlowym
        od_rundy: 10
        zasieg: strefa
        emisja: godzina degustacji
        cena_emisji: 80   # B10: przy 110 zł 1,5× drożej na efekt niż druk
        znizki: [[4, 0.15], [8, 0.25]]
        maks_emisji: 12
        pula: 0.06
        przyciaganie: 0.2
        teksty:
        - 'Na festynie w strefie {strefa} Twoje stoisko stało między dmuchanym zamkiem a kołem gospodyń wiejskich.
          Panie z koła najpierw patrzyły podejrzliwie, potem wzięły przepis na sos. Wymiana: przepis na pierogi.'
        - 'Degustacja w strefie {strefa}: Koziołek w przebraniu zjadł 11 próbek, zanim ktokolwiek inny podszedł.
          Dzieci uznały, że skoro Koziołek je, to musi być dobre. Kolejka ustawiła się do końca festynu.'
      noc_kebaba:
        nazwa: Noc Kebaba na otrzęsinach
        od_rundy: 10
        zasieg: strefa
        strefy:
        - akademickie
        - politechnika
        emisja: godzina stoiska na imprezie
        cena_emisji: 200   # B10: przy 400 zł przegrywała z brakiem kampanii nawet w strefie akademickiej
        znizki: [[3, 0.15], [6, 0.3]]
        maks_emisji: 8
        pula: 0.16
        przyciaganie: 0.4
        teksty:
        - 'Noc Kebaba w strefie {strefa}: DJ grał do trzeciej, Ty kroiłeś do czwartej. Pierwszy rok studiów już wie,
          gdzie się je po kolokwium. Ktoś z politechniki zaproponował, żeby zrobić z tego przedmiot obieralny.'
        - 'Na otrzęsinach w strefie {strefa} starosta roku ogłosił Twój kebab „oficjalnym posiłkiem sesji”. Dziekan
          podobno nie protestował, bo dostał porcję bez cebuli.'

# UF19 (plan ufajniania, 6.11.2026): marketing internetowy od rundy 7 – agencja Lajk przeniesiona z reklamy
# tradycyjnej + nowe kanały. Liczby – założenie UF19 (do kalibracji): suma wag narastanie + ogon trwałości ≈ 5,6
# rundy efektu (reklama tradycyjna ≈ 1,9), więc przyciąganie kanałów ok. 2,5× mniejsze niż w podobnych kanałach
# tradycyjnych przy podobnych cenach – na całą grę wychodzi podobnie, ale z opóźnieniem i długim ogonem.
internet:
  model:
    narastanie: [0.35, 0.7, 1.0]   # część efektu w rundzie emisji, rundę później, dwie rundy później
    trwalosc: 0.8                   # potem co rundę × 0,8 (tradycyjna: × 0,5)
    prog_wygasania: 0.1
  agencje:
    lajk:
      nazwa: Agencja „Lajk i Spółka”
      budynek: agencja_lajk
      rodzaj: internet
      opis: Trzech studentów, dwa ringlighty i jeden iPhone z pękniętym ekranem. Mówią o sobie „boutique social media
        house”. Internet niczego nie zapomina – Twoje posty też nie.
      kanaly:
        grupa_osiedlowa:
          nazwa: Posty na grupach osiedlowych
          od_rundy: 7
          zasieg: strefa
          emisja: post na grupie
          cena_emisji: 35
          znizki: [[4, 0.1], [11, 0.25]]
          maks_emisji: 20
          pula: 0.01
          przyciaganie: 0.05
          teksty:
          - 'Post na grupie „Strefa {strefa} – Uwaga, Policja / Sprzedam / Oddam” zebrał 214 komentarzy. 180 to kłótnia
            o to, czy kebab może mieć ananasa. Wygrałeś: wszyscy już znają nazwę lokalu.'
          - 'Administratorka grupy osiedlowej w strefie {strefa} usunęła post jako reklamę, po czym sama zamówiła u Ciebie
            dwa kebaby i wrzuciła zdjęcie z podpisem „Polecam, nie reklama”. Zasięg: trzy razy większy.'
        influencer:
          nazwa: Influencerka „Kebabowa Królowa” (TikTok)
          od_rundy: 7
          zasieg: strefa
          emisja: relacja influencerki
          cena_emisji: 120
          znizki: [[3, 0.15], [6, 0.25]]
          maks_emisji: 10
          pula: 0.03
          przyciaganie: 0.12
          teksty:
          - 'Kebabowa Królowa nagrała w strefie {strefa} 47 ujęć jednego gryza w zwolnionym tempie. Sos kapnął jej na
            kamerę, co podbiło film do 300 tysięcy wyświetleń. Komentarz numer jeden: „gdzie to jest, jadę”.'
          - 'Filmik „Oceniam kebaby w strefie {strefa} na ślepo” skończył się dla Ciebie notą 9/10 („minus punkt, bo
            serwetki za cienkie”). Kupiłeś grubsze serwetki. Agencja chce za to osobny bonus.'
        tiktok:
          nazwa: Własne filmiki na TikToku
          od_rundy: 7
          zasieg: miasto
          emisja: filmik z kuchni
          cena_emisji: 60
          znizki: [[5, 0.15], [10, 0.25]]
          maks_emisji: 15
          pula: 0.01
          przyciaganie: 0.04
          teksty:
          - 'Student z agencji nagrał, jak kucharz kroi mięso z rożna w rytm disco polo. Filmik obejrzało pół miasta,
            a druga połowa nagrała duet. W komentarzach toczy się spór, czy to „ASMR”, czy „zwykły obiad”.'
          - 'Seria „Sos dnia” ma już stałych widzów: ktoś z {strefa} codziennie pisze „za mało czosnku”, po czym
            przychodzi i zamawia podwójny czosnek. Algorytm uznał to za zaangażowanie i pokazuje Was dalej.'
        mapy:
          nazwa: Wizytówka w Mapach Google i opinie
          od_rundy: 7
          zasieg: strefa
          emisja: dzień wyróżnienia w wynikach
          cena_emisji: 25
          znizki: [[4, 0.15], [7, 0.3]]
          maks_emisji: 7
          pula: 0.0
          przyciaganie: 0.08
          teksty:
          - 'Ktoś w strefie {strefa} wpisał „kebab blisko mnie” i pierwszy wyskoczył Twój lokal, ze zdjęciem z idealnym
            światłem (agencja trzymała lampę 40 minut). Najczęstsza opinia: „wygląda jak na zdjęciu, szok”.'
          - 'Agencja odpowiedziała grzecznie na każdą z 37 opinii w strefie {strefa}, także na tę „byłem tylko po
            serwetki, 5/5”. Mapa pokazuje Was teraz wyżej niż pizzerię, która nie odpisuje od 2019 roku.'
        lublin_jedzie:
          nazwa: Grupa „Lublin Jedzie” (posty i konkursy)
          od_rundy: 7
          zasieg: miasto
          emisja: post z konkursem
          cena_emisji: 50
          znizki: [[4, 0.1], [8, 0.2]]
          maks_emisji: 10
          pula: 0.02
          przyciaganie: 0.04
          teksty:
          - 'Konkurs na grupie „Lublin Jedzie”: „Oznacz osobę, z którą zjesz kebaba o 3 w nocy”. Oznaczono 1 200 osób,
            w tym prezydenta miasta (dwa razy). Nagroda – kebab XXL – czeka na odbiór.'
          - 'Administrator grupy „Lublin Jedzie” przypiął Twój post między zdjęciem dziury w jezdni a pytaniem „czy
            ktoś zgubił kozę?”. Koza się znalazła, a Twój lokal zyskał 300 nowych obserwujących.'
