<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ gra.nazwa }} – wybór firmy</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styl.css">
  <link rel="stylesheet" href="/static/motywy/talerze.css">
  <link rel="stylesheet" href="/static/motywy/grafik.css">
  <link rel="stylesheet" href="/static/motywy/noc.css">
  <script src="/static/motyw.js"></script>
</head>
<body>
  <header class="naglowek"><div class="logo"><div class="serce"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M8 6h8l-1 4H9z"/><path d="M7.5 10h9l-1 5h-7z"/><path d="M9 15h6l-1 3h-4z"/></svg></div><div>Levas <br>Kebab</div><div class="firma">{{ gra.nazwa }}</div></div>
    <div class="konto"><a href="/">Lista gier</a>{% include "konta/_konto.html" %}</div></header>
  <main class="scena"><div class="karta">
    <div class="karta-glowa"><div class="tytul">Którą firmą grasz?</div><div></div><div></div></div>
    <div class="tresc"><div class="siatka">
      {% for f in ludzie %}<div class="kafel"><div class="kg">{{ f }}</div><div class="kd" style="padding-top:14px">
        <a class="btn pom" href="/gra/{{ id|urlencode }}/{{ f|urlencode:'' }}">Graj jako {{ f }}</a></div></div>{% endfor %}
    </div><p class="podpowiedz">Gra na jednym komputerze: każdy gracz wybiera swoją firmę, podejmuje decyzje i klika „Wyślij decyzje”.
      Runda przelicza się, gdy wszyscy wyślą.</p></div>
  </div></main>
</body>
</html>
