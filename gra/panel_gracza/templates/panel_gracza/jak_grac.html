<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Levas – jak grać</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
  <style>
    :root { --pom: #e45f26; --pom-ciemny: #c64b15; --pom-jasny: #fff1ea; --tekst: #2b2b30; --szary: #70707a;
      --linia: #ebe7e4; --tlo: #f5f2ef; --karta: #fff; --niebieski: #2d6fd2; --niebieski-jasny: #eaf1fc;
      --cien: 0 1px 2px rgba(30, 20, 10, .05), 0 4px 16px rgba(30, 20, 10, .06); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--tlo); color: var(--tekst); font: 17px/1.65 "Nunito Sans", system-ui, sans-serif; }
    .naglowek { background: #1f1f22; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 14px; }
    .naglowek .logo { font: 800 18px/1.1 Montserrat, sans-serif; display: flex; align-items: center; gap: 10px; }
    .naglowek .serce { width: 34px; height: 34px; border-radius: 9px; background: var(--pom); display: grid; place-items: center; }
    .naglowek a { color: #fff; opacity: .8; margin-left: auto; text-decoration: none; font-weight: 600; }
    .naglowek a:hover { opacity: 1; }
    .uklad { max-width: 1180px; margin: 0 auto; padding: 28px 16px 60px; display: grid; grid-template-columns: 250px 1fr; gap: 28px; align-items: start; }
    .spis { position: sticky; top: 20px; background: var(--karta); border-radius: 12px; box-shadow: var(--cien); padding: 18px 16px; font-size: 14.5px; }
    .spis b { display: block; font: 700 13px Montserrat, sans-serif; text-transform: uppercase; letter-spacing: .06em; color: var(--szary); margin-bottom: 8px; }
    .spis a { display: block; color: var(--tekst); text-decoration: none; padding: 4px 8px; border-radius: 6px; line-height: 1.35; }
    .spis a:hover { background: var(--pom-jasny); color: var(--pom-ciemny); }
    article { background: var(--karta); border-radius: 14px; box-shadow: var(--cien); padding: 36px 48px 44px; min-width: 0; }
    h1 { font: 800 40px/1.15 Montserrat, sans-serif; margin: 0 0 6px; }
    h1 span { color: var(--pom); }
    .podtytul { color: var(--szary); margin: 0 0 24px; font-size: 16px; }
    h2 { font: 700 25px/1.25 Montserrat, sans-serif; margin: 42px 0 12px; padding-top: 18px; border-top: 2px solid var(--linia); scroll-margin-top: 16px; }
    h3 { font: 700 19px Montserrat, sans-serif; margin: 26px 0 8px; }
    p { margin: 0 0 14px; }
    ul, ol { margin: 0 0 16px; padding-left: 26px; }
    li { margin: 5px 0; }
    li::marker { color: var(--pom); font-weight: 700; }
    b { font-weight: 700; color: #1f1f22; }
    code { background: #f1eeeb; border-radius: 5px; padding: 1px 6px; font-size: .9em; }
    a { color: var(--pom-ciemny); }
    hr { border: 0; border-top: 2px solid var(--linia); margin: 36px 0 18px; }
    .ramka { border-radius: 12px; padding: 14px 18px 2px; margin: 18px 0 20px; border-left: 5px solid var(--pom); background: var(--pom-jasny); }
    .ramka.uwaga { border-left-color: var(--niebieski); background: var(--niebieski-jasny); }
    .tabela { overflow-x: auto; margin: 6px 0 20px; border-radius: 10px; border: 1px solid var(--linia); }
    table { border-collapse: collapse; width: 100%; font-size: 15.5px; }
    th { background: #1f1f22; color: #fff; text-align: left; font: 600 14px Montserrat, sans-serif; padding: 10px 14px; }
    td { padding: 9px 14px; border-top: 1px solid var(--linia); vertical-align: top; }
    tbody tr:nth-child(even) td { background: #faf8f6; }
    td:first-child { font-weight: 700; white-space: nowrap; }
    @media (max-width: 860px) {
      .uklad { grid-template-columns: minmax(0, 1fr); padding-top: 16px; }
      .spis { position: static; }
      article { padding: 24px 18px 30px; }
      h1 { font-size: 31px; }
      td:first-child { white-space: normal; }
    }
    @media print {
      @page { size: A4; margin: 16mm 15mm; }
      body { background: #fff; font-size: 11.5pt; }
      .naglowek, .spis { display: none; }
      .uklad { display: block; padding: 0; max-width: none; }
      article { box-shadow: none; padding: 0; }
      h2 { break-after: avoid; }
      .ramka, .tabela, tr, li { break-inside: avoid; }
      th, .ramka, tbody tr:nth-child(even) td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <header class="naglowek"><div class="logo"><div class="serce"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M8 6h8l-1 4H9z"/><path d="M7.5 10h9l-1 5h-7z"/><path d="M9 15h6l-1 3h-4z"/></svg></div><div>Levas Kebab</div></div>
    <a href="{{ powrot }}">← {{ powrot_tekst }}</a></header>
  <div class="uklad">
    <nav class="spis"><b>Spis treści</b>{% for r in spis %}<a href="#{{ r.kotwica }}">{{ r.tytul }}</a>{% endfor %}</nav>
    <article>
      <h1>{{ tytul }}<span>.</span></h1>
      <p class="podtytul">Instrukcja dla graczy · symulacja lokalu z kebabem w Lublinie</p>
      {{ tresc|safe }}
    </article>
  </div>
</body>
</html>
