# Składniki (w kodzie: zasoby)
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'Składniki dań (w kodzie silnika: zasoby): opakowanie, jednostka, typ opakowania, średnie ceny. Kolejność = kolejność
  w raportach. Świeżość (gra z lokalami, F3a.5): przechowywanie (chlodnia, zamrazarka, suche), termin_dni – ile dni
  partia nadaje się do użycia razem z dniem dostawy (brak = bez terminu), miejsce_l – litry jednego opakowania w chłodni
  lub zamrażarce; zamiennik_dla – składnik używany, gdy zabraknie podstawowego (jakość niższa o kara_jakosci gwiazdek).'
zrodlo: notatki/Menu i składniki.md (receptury i ceny rynkowe brutto ze starego Levasa, terminy ważności); ceny hurtowe –
  założenie F2.6 (rząd wielkości cen hurtowni gastronomicznych); objętości opakowań i ceny mrożonek (ok. 80% świeżych) –
  założenie F3a.5
