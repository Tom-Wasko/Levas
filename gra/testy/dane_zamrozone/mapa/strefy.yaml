# Strefy Lublina (mapa miasta)
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'Dziesięć stref Lublina na wspólnej mapie gry. mapa: prostokąt w polach siatki (x, y – lewy górny róg, szer
  × gl); kolor – barwa strefy na mapie. Popyt stref (klienci, ich preferencje) – krok F3a.4.'
zrodlo: notatka „Ustalenia gry” (lista stref); położenie stref uproszczone względem prawdziwego Lublina
siatka:
  szer: 21
  gl: 20
strefy:
