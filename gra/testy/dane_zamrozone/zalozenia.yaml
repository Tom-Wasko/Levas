# Założenia (parametry mechanik)
# Sprawdzenie: python -m silnik.dane sprawdz
opis: 'Parametry mechanik gry, których nie widać wprost w grze REVAS. Każdy ma: wartosc, pewnosc (potwierdzone /
  skalibrowane / zalozenie) i zrodlo. Zmiana tu zmienia działanie silnika bez zmian w kodzie. Kalibracje: revas_gra/kalibracja/*.py,
  opis: dokumentacja/WIEDZA_O_GRZE.md.'
